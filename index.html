<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Purchase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-red-500">Buy Bundles</h2>
        
        <form id="purchaseForm" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">Select Package</label>
                <select id="bundle" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white">
                    <option value="1GB">1 GB - 20 ZMW</option>
                    <option value="2GB">2 GB - 35 ZMW</option>
                    <option value="5GB">5 GB - 70 ZMW</option>
                </select>
            </div>

            <div>
                <label class="block text-sm mb-1">Phone Number</label>
                <input type="tel" id="phone" placeholder="097xxxxxxx" required
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white">
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 font-semibold py-3 rounded-lg">
                Submit Order
            </button>
        </form>
    </div>

    <script>
        document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bundle = document.getElementById('bundle').value;
            const phone = document.getElementById('phone').value;

            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bundle, phone })
            });

            const data = await res.json();
            if (data.success) {
                alert('Order received! Check your Telegram for updates.');
            } else {
                alert('Failed to submit order.');
            }
        });
    </script>
</body>
</html>
